<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Naturals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1322;
            color: #ffffff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main-card {
            background-color: #131b2e;
            border-radius: 1rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            width: 100%;
            max-width: 450px;
        }
        .form-control {
            background-color: #1a233a;
            border: 1px solid #2a3754;
            color: #ffffff;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background-color: #1a233a;
            border-color: #22c55e;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(34, 197, 94, 0.25);
        }
        .form-control::placeholder {
            color: #6b7280;
        }
        .btn-neon-exact {
            background-color: #22c55e;
            border: none;
            color: #0d1322;
            font-weight: 700;
            border-radius: 0.5rem;
            padding: 0.75rem;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: all 0.2s ease;
        }
        .btn-neon-exact:hover {
            background-color: #16a34a;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="main-card p-4 p-md-5">
            <h3 class="mb-4 text-center fw-bold text-white">Iniciar Sesión</h3>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label text-light small fw-bold">Correo Electrónico</label>
                    <input type="email" class="form-control" id="username" name="username" placeholder="Correo electrónico" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label text-light small fw-bold">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-neon-exact">Ingresar</button>
                </div>
                <div class="text-center mt-3">
                    <a href="/registro" class="text-success text-decoration-none small">¿No tienes cuenta? Regístrate aquí</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
