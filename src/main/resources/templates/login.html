<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Naturals</title>
    <!-- Icono de la página -->
    <link rel="icon" type="image/png" th:href="@{/logo.png}">
    <link rel="apple-touch-icon" th:href="@{/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>

    <div class="container d-flex align-items-center justify-content-center vh-100">
        <div class="main-card p-4 p-md-5 shadow-lg" style="width: 100%; max-width: 420px;">
            <h3 class="mb-4 text-center fw-bold text-white">Iniciar Sesión</h3>
            
            <form th:action="@{/login}" th:object="${usuario}" method="post">
                <div class="mb-3">
                    <label for="nombreUsuario" class="form-label text-light small fw-bold">Nombre de Usuario</label>
                    <input type="text" class="form-control" id="nombreUsuario" th:field="*{nombreUsuario}" placeholder="Tu usuario" required>
                </div>
                <div class="mb-4">
                    <label for="contrasena" class="form-label text-light small fw-bold">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" th:field="*{contrasena}" placeholder="Contraseña" required>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-success w-100">Ingresar</button>
                </div>
                <div class="text-center mt-3">
                    <a href="/registro" class="text-success text-decoration-none small">¿No tienes cuenta? Regístrate aquí</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
