<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Naturals</title>
    <!-- Icono de la página -->
    <link rel="icon" type="image/png" th:href="@{/logo.png}">
    <link rel="apple-touch-icon" th:href="@{/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card p-4 shadow-sm" style="width: 400px;">
        <h3 class="text-center mb-4 fw-bold">Crear Cuenta</h3>
        
        <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label for="nombreUsuario" class="form-label">Nombre de Usuario</label>
                <input type="text" class="form-control" id="nombreUsuario" th:field="*{nombreUsuario}" required>
            </div>
            
            <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" th:field="*{correo}" required>
            </div>
            
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono / Celular</label>
                <input type="tel" class="form-control" id="telefono" th:field="*{telefono}" required>
            </div>
            
            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" th:field="*{contrasena}" required>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-success">Registrarse</button>
            </div>
        </form>
        
        <div class="text-center mt-3">
            <a href="/login" class="text-decoration-none small">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>

</body>
</html>
