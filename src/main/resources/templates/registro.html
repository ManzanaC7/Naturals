<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Naturals Devs - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 10px; }
        .form-control { background-color: #2a2a2a; border: 1px solid #444; color: #ffffff; }
        .form-control:focus { background-color: #2a2a2a; border-color: #00ffcc; color: #ffffff; box-shadow: none; }
        .text-neon { color: #00ffcc; }
        .btn-neon { background-color: #00ffcc; color: #121212; font-weight: bold; border: none; }
        .btn-neon:hover { background-color: #00b386; color: #ffffff; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 400px;">
        <div class="card p-4 shadow-lg">
            <h3 class="text-center mb-4 text-neon fw-bold">Registro - Naturals Devs</h3>

            <form th:action="@{/registro}" th:object="${usuario}" method="post">
                <div class="mb-3">
                    <label for="correo" class="form-label text-secondary">Correo Electrónico</label>
                    <input type="email" id="correo" class="form-control" th:field="*{correo}" required placeholder="correo@ejemplo.com">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary">Contraseña</label>
                    <input type="password" id="password" class="form-control" th:field="*{password}" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-neon w-100 py-2 mt-2">Registrarse</button>
            </form>

            <div class="text-center mt-3">
                <small class="text-secondary">¿Ya tienes cuenta? <a href="/login" class="text-neon text-decoration-none">Inicia sesión</a></small>
            </div>
        </div>
    </div>

</body>
</html>
