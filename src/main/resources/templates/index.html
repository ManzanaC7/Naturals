<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Naturals</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1322; /* Tono exacto azul oscuro de tu imagen */
            color: #ffffff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .main-card {
            background-color: #131b2e; /* Tarjeta con el tono preciso */
            border-radius: 1rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .form-control {
            background-color: #1a233a;
            border: 1px solid #2a3754;
            color: #ffffff;
            border-radius: 0.5rem;
            padding: 0.7rem 0.9rem;
        }
        .form-control:focus {
            background-color: #1a233a;
            border-color: #22c55e;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(34, 197, 94, 0.25);
        }
        .form-control::placeholder {
            color: #6b7280;
        }
        .btn-neon-exact {
            background-color: #22c55e;
            border: none;
            color: #0d1322;
            font-weight: 700;
            border-radius: 0.5rem;
            padding: 0.75rem;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: all 0.2s ease;
        }
        .btn-neon-exact:hover {
            background-color: #16a34a;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
        }
        .table-custom {
            color: #ffffff;
            background-color: #131b2e;
        }
        .table-custom th, .table-custom td {
            background-color: #131b2e;
            color: #ffffff;
            border-color: #2a3754;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <!-- Cabecera -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-2">
            <h2 class="fw-bold">Panel de Inventario</h2>
            <div>
                <span class="me-3 text-light" th:text="${usuarioLogueado != null ? 'Bienvenido, ' + usuarioLogueado.nombre : ''}">Usuario</span>
                <a href="/finanzas" class="btn btn-outline-success btn-sm">Ver Finanzas</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
            </div>
        </div>

        <!-- Formulario para agregar producto -->
        <div class="main-card p-4 p-md-5 mb-5">
            <h4 class="mb-4 text-center fw-bold">Agregar Nuevo Producto</h4>
            <form th:action="@{/inventario/guardar}" th:object="${producto}" method="post">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="nombre" class="form-label text-light small fw-bold">Nombre del Producto</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Nombre completo" required>
                    </div>
                    <div class="col-md-4">
                        <label for="precio" class="form-label text-light small fw-bold">Precio Unitario ($)</label>
                        <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}" placeholder="Precio" required>
                    </div>
                    <div class="col-md-4">
                        <label for="cantidad" class="form-label text-light small fw-bold">Cantidad</label>
                        <input type="number" class="form-control" id="cantidad" th:field="*{cantidad}" placeholder="Cantidad" required>
                    </div>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-neon-exact">Guardar Producto</button>
                </div>
            </form>
        </div>

        <!-- Tabla de productos -->
        <div class="main-card p-4">
            <h4 class="mb-3 fw-bold">Productos en Stock</h4>
            <div class="table-responsive">
                <table class="table table-custom align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${productos}">
                            <td th:text="${p.id}">1</td>
                            <td th:text="${p.nombre}">Producto</td>
                            <td th:text="${p.precio}">0.0</td>
                            <td th:text="${p.cantidad}">0</td>
                            <td>
                                <a th:href="@{/inventario/eliminar/{id}(id=${p.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
