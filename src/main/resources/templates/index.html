<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Naturals</title>
    <!-- Icono de la página -->
    <link rel="icon" type="image/png" th:href="@{/logo.png}">
    <link rel="apple-touch-icon" th:href="@{/logo.png}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>

    <div class="container py-5">
        <!-- Cabecera -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-2">
            <h2 class="fw-bold">Panel de Inventario</h2>
            <div>
                <span class="me-3 text-light" th:text="${usuarioLogueado != null ? 'Bienvenido, ' + usuarioLogueado.nombreUsuario : ''}">Usuario</span>
                <a href="/finanzas" class="btn btn-outline-success btn-sm">Ver Finanzas</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
            </div>
        </div>

        <!-- Formulario para agregar / editar producto -->
        <div class="main-card p-4 p-md-5 mb-5">
            <h4 class="mb-4 text-center fw-bold" th:text="${producto.id != null} ? 'Editar Producto' : 'Agregar Nuevo Producto'">Agregar Nuevo Producto</h4>
            <form th:action="@{/inventario/guardar}" th:object="${producto}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="nombre" class="form-label text-light small fw-bold">Nombre del Producto</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ej. Torta tres leches" required>
                    </div>
                    <div class="col-md-3">
                        <label for="precioCompra" class="form-label text-light small fw-bold">Precio de Compra ($ COP)</label>
                        <input type="number" step="0.01" class="form-control" id="precioCompra" th:field="*{precioCompra}" placeholder="Ej. 15000" required>
                    </div>
                    <div class="col-md-3">
                        <label for="precioVenta" class="form-label text-light small fw-bold">Precio de Venta ($ COP)</label>
                        <input type="number" step="0.01" class="form-control" id="precioVenta" th:field="*{precioVenta}" placeholder="Ej. 17000" required>
                    </div>
                    <div class="col-md-3">
                        <label for="cantidad" class="form-label text-light small fw-bold">Cantidad</label>
                        <input type="number" class="form-control" id="cantidad" th:field="*{cantidad}" placeholder="Cantidad" required>
                    </div>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-success w-100" th:text="${producto.id != null} ? 'Actualizar Producto' : 'Guardar Producto'">Guardar Producto</button>
                </div>
                
                <div class="text-center mt-2" th:if="${producto.id != null}">
                    <a href="/inventario" class="text-muted small text-decoration-none">Cancelar edición</a>
                </div>
            </form>
        </div>

        <!-- Tabla de productos con Buscador y Acciones en Lote -->
        <div class="main-card p-4">
            <form th:action="@{/inventario/lote}" method="post">
                <div class="row align-items-center mb-3">
                    <div class="col-md-4 mb-2 mb-md-0">
                        <h4 class="fw-bold m-0">Productos en Stock</h4>
                    </div>
                    <!-- Buscador en tiempo real -->
                    <div class="col-md-4 mb-2 mb-md-0">
                        <input type="text" id="buscadorInventario" class="form-control form-control-sm" placeholder="Buscar producto...">
                    </div>
                    <div class="col-md-4 text-md-end">
                        <button type="submit" name="accion" value="vender" class="btn btn-success btn-sm me-1">Vender</button>
                        <button type="submit" name="accion" value="eliminar" class="btn btn-danger btn-sm">Eliminar</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-custom align-middle" id="tablaInventario">
                        <thead>
                            <tr>
                                <th style="width: 40px;">
                                    <input type="checkbox" id="selectAll" class="form-check-input">
                                </th>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Compra</th>
                                <th>Venta</th>
                                <th>Cantidad</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${productos}">
                                <td>
                                    <input type="checkbox" name="ids" th:value="${p.id}" class="form-check-input">
                                </td>
                                <td th:text="${p.id}">1</td>
                                <td class="nombre-producto" th:text="${p.nombre}">Producto</td>
                                <td th:text="${'&#36; ' + #numbers.formatDecimal(p.precioCompra != null ? p.precioCompra : 0.0, 1, 'DEFAULT', 2, 'DEFAULT')}">0.0</td>
                                <td th:text="${'&#36; ' + #numbers.formatDecimal(p.precioVenta != null ? p.precioVenta : 0.0, 1, 'DEFAULT', 2, 'DEFAULT')}">0.0</td>
                                <td th:text="${p.cantidad}">0</td>
                                <td>
                                    <a th:href="@{/inventario/vender/{id}(id=${p.id})}" class="btn btn-success btn-sm me-1">Vender</a>
                                    <a th:href="@{/inventario/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm me-1">Editar</a>
                                    <a th:href="@{/inventario/eliminar/{id}(id=${p.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts: Seleccionar Todos y Buscador -->
    <script>
        document.getElementById('selectAll').addEventListener('change', function(e) {
            let checkboxes = document.querySelectorAll('input[name="ids"]');
            for (let checkbox of checkboxes) {
                checkbox.checked = e.target.checked;
            }
        });

        document.getElementById('buscadorInventario').addEventListener('keyup', function() {
            let filtro = this.value.toLowerCase();
            let filas = document.querySelectorAll('#tablaInventario tbody tr');
            
            filas.forEach(fila => {
                let nombre = fila.querySelector('.nombre-producto').textContent.toLowerCase();
                if (nombre.includes(filtro)) {
                    fila.style.display = '';
                } else {
                    fila.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
