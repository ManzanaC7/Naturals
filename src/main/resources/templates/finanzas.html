<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Finanzas - Naturals</title>
    <!-- Icono de la página -->
    <link rel="icon" type="image/png" th:href="@{/logo.png}">
    <link rel="apple-touch-icon" th:href="@{/logo.png}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>

    <div class="container py-5">
        <!-- Cabecera -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-2">
            <h2 class="fw-bold">Panel de Finanzas</h2>
            <div>
                <span class="me-3 text-light" th:text="${usuarioLogueado != null ? 'Bienvenido, ' + usuarioLogueado.nombreUsuario : ''}">Usuario</span>
                <a href="/inventario" class="btn btn-outline-success btn-sm">Volver al Inventario</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
            </div>
        </div>

        <!-- Tarjetas de Resumen Financiero -->
        <div class="row text-center mb-4">
            <div class="col-md-4 mb-3">
                <div class="card bg-success text-white p-3 shadow-sm">
                    <h5>Total Ingresos</h5>
                    <h3 class="fw-bold" th:text="${'&#36; ' + #numbers.formatDecimal(totalIngresos != null ? totalIngresos : 0.0, 1, 'DEFAULT', 2, 'DEFAULT')}">$ 0.0</h3>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-danger text-white p-3 shadow-sm">
                    <h5>Total Egresos</h5>
                    <h3 class="fw-bold" th:text="${'&#36; ' + #numbers.formatDecimal(totalEgresos != null ? totalEgresos : 0.0, 1, 'DEFAULT', 2, 'DEFAULT')}">$ 0.0</h3>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-primary text-white p-3 shadow-sm">
                    <h5>Balance Neto</h5>
                    <h3 class="fw-bold" th:text="${'&#36; ' + #numbers.formatDecimal(balanceTotal != null ? balanceTotal : 0.0, 1, 'DEFAULT', 2, 'DEFAULT')}">$ 0.0</h3>
                </div>
            </div>
        </div>

        <!-- Tabla de Movimientos / Finanzas con Buscador -->
        <div class="main-card p-4">
            <form th:action="@{/finanzas/lote}" method="post">
                <div class="row align-items-center mb-3">
                    <div class="col-md-5 mb-2 mb-md-0">
                        <h4 class="fw-bold m-0">Historial de Ingresos y Egresos</h4>
                    </div>
                    <!-- Buscador en tiempo real -->
                    <div class="col-md-4 mb-2 mb-md-0">
                        <input type="text" id="buscadorFinanzas" class="form-control form-control-sm" placeholder="Buscar movimiento...">
                    </div>
                    <div class="col-md-3 text-md-end">
                        <button type="submit" name="accion" value="eliminar" class="btn btn-danger btn-sm w-100">Eliminar Seleccionados</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-custom align-middle" id="tablaFinanzas">
                        <thead>
                            <tr>
                                <th style="width: 40px;">
                                    <input type="checkbox" id="selectAllFinanzas" class="form-check-input">
                                </th>
                                <th>ID</th>
                                <th>Tipo</th>
                                <th>Descripción</th>
                                <th>Valor</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${movimientos}">
                                <td>
                                    <input type="checkbox" name="ids" th:value="${m.id}" class="form-check-input">
                                </td>
                                <td th:text="${m.id}">1</td>
                                <td>
                                    <span th:text="${m.tipo}" 
                                          th:class="${m.tipo == 'INGRESO' ? 'badge bg-success' : 'badge bg-danger'}">
                                    </span>
                                </td>
                                <td class="desc-movimiento" th:text="${m.descripcion}">Descripción del movimiento</td>
                                <!-- Formato de moneda en pesos colombianos (COP) -->
                                <td th:text="${'&#36; ' + #numbers.formatDecimal(m.monto != null ? m.monto : 0.0, 1, 'DEFAULT', 2, 'DEFAULT')}">0.0</td>
                                <td>
                                    <!-- Botón para eliminar movimiento individual -->
                                    <a th:href="@{/finanzas/eliminar/{id}(id=${m.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts: Seleccionar Todos y Buscador -->
    <script>
        document.getElementById('selectAllFinanzas').addEventListener('change', function(e) {
            let checkboxes = document.querySelectorAll('input[name="ids"]');
            for (let checkbox of checkboxes) {
                checkbox.checked = e.target.checked;
            }
        });

        document.getElementById('buscadorFinanzas').addEventListener('keyup', function() {
            let filtro = this.value.toLowerCase();
            let filas = document.querySelectorAll('#tablaFinanzas tbody tr');
            
            filas.forEach(fila => {
                let descripcion = fila.querySelector('.desc-movimiento').textContent.toLowerCase();
                if (descripcion.includes(filtro)) {
                    fila.style.display = '';
                } else {
                    fila.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
