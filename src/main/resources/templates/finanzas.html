<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Caja y Finanzas - Naturals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1322;
            color: #ffffff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .main-card {
            background-color: #131b2e;
            border-radius: 1rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .form-control {
            background-color: #1a233a;
            border: 1px solid #2a3754;
            color: #ffffff;
            border-radius: 0.5rem;
            padding: 0.7rem 0.9rem;
        }
        .form-control:focus {
            background-color: #1a233a;
            border-color: #22c55e;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(34, 197, 94, 0.25);
        }
        .btn-neon-exact {
            background-color: #22c55e;
            border: none;
            color: #0d1322;
            font-weight: 700;
            border-radius: 0.5rem;
            padding: 0.75rem;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: all 0.2s ease;
        }
        .btn-neon-exact:hover {
            background-color: #16a34a;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
        }
        .table-custom {
            color: #ffffff;
            background-color: #131b2e;
        }
        .table-custom th, .table-custom td {
            background-color: #131b2e;
            color: #ffffff;
            border-color: #2a3754;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <!-- Cabecera -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-2">
            <h2 class="fw-bold">Panel de Caja y Finanzas</h2>
            <div>
                <a href="/inventario" class="btn btn-outline-success btn-sm me-2">Ir a Inventario</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
            </div>
        </div>

        <!-- Contenedor principal de Caja -->
        <div class="main-card p-4 p-md-5 mb-5">
            <h4 class="mb-4 fw-bold">Control de Caja</h4>
            <!-- Aquí puedes agregar tus formularios o resúmenes de caja -->
            <p class="text-secondary">Vista general de ingresos, salidas y balance de caja actual.</p>
        </div>
    </div>

</body>
</html>
